# File location: .github/workflows/action.yml
name: Connect to an AWS role from a GitHub repository and install the action to create dashbaord in the CloudWatch

# Execute the action when the user open a new issue
on:
  issues:
    types: [opened]

# Change the region to current region
env:
  AWS_REGION: "us-east-1"

permissions:
  id-token: write
  contents: read


# *** ADD THE CODE SNIPET BELOW ***
jobs:
  AssumeRoleAndCallIdentity:
    runs-on: ubuntu-latest
    environment: ACTIONS
    steps:
      # Add this step to authenticate on the AWS account 
      - name: configure aws credentials
        uses: aws-actions/configure-aws-credentials@v1.7.0
        with:
          role-to-assume: arn:aws:iam::700552527916:role/to_enable_creating_dashbaords
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}
      
      # Add this step to load the github action
      - name: create dash
        env: 
          ACTION_NAME: ${{ secrets.ACTION_NAME }} # Create a new environment in your repository with the ARN 
        uses: "JonasBarros1998/automate-dashboards@2.0.3-DR"